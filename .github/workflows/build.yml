name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NovoRaioX --hidden-import=pythoncom --hidden-import=pywintypes --hidden-import=win32com.client --collect-all=fitz --collect-all=docx app.py
      - name: Include default config
        shell: pwsh
        run: Copy-Item config.json dist/config.json
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NovoRaioX-Windows
          path: |
            dist/NovoRaioX.exe
            dist/config.json
          if-no-files-found: error
          retention-days: 30
